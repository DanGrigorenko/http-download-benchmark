# CI pipeline: quality gates, test matrix with coverage, packaging smoke test.
#
# Mirrors the local dev workflow (see scripts/smoke_test.sh and the README):
#   - quality: ruff lint + format check + strict mypy (configuration and the
#     exact commands come from pyproject.toml / the dev extras)
#   - tests:   pytest with coverage on every supported Python (3.9 / 3.12 / 3.14)
#   - package: build sdist + wheel, then the offline smoke test installs the
#     wheel in a fresh environment and benchmarks the real console command
#     against a local HTTP server (success Run + 404 failure path)

name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (ruff + strict mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: Mypy strict type check
        run: mypy

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.14"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=http_download_benchmark
          --cov-report=term
          --cov-report=xml:coverage.xml
      - name: Add coverage report to the job summary
        run: python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Packaging (build + offline smoke test)
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
      - name: Build sdist and wheel
        run: python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Offline smoke test (fresh wheel install, local HTTP server)
        run: bash scripts/smoke_test.sh dist/*.whl
